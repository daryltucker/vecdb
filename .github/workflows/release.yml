name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pin which CUDA major the prebuilt ONNX Runtime links against.
  #
  # Unset, ort-sys infers this from the BUILD MACHINE (CUDA_HOME,
  # NV_CUDA_CUDART_VERSION, `nvcc --version`). On a hosted runner that means
  # the published artifact's libcudart requirement is decided by whatever the
  # runner image happened to ship that week — invisible to us and to users.
  # Published binaries must be a function of the tag, not of the runner.
  #
  # 12, not 13: both flavours carry the identical kernel set
  # (sm_75/sm_80/sm_90), so this only decides which CUDA the user needs
  # installed, and CUDA 12 is more widely deployed with a lower minimum
  # driver. See docs/GPU.md.
  ORT_CUDA_VERSION: "12"

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      # The four targets are independent. Let each one finish so a failure on
      # one shows every failure at once instead of cancelling three healthy
      # builds; publish-release still needs all four.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: vecdb-x86_64-unknown-linux-gnu
            asset_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: vecdb-x86_64-pc-windows-msvc
            asset_ext: ".exe"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: vecdb-aarch64-unknown-linux-gnu
            asset_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: vecdb-aarch64-apple-darwin
            asset_ext: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        # Pinned, not `stable`, for the same reason ORT_CUDA_VERSION is pinned:
        # a published binary is a function of the tag, not of whatever the
        # runner had that week. Concretely: cargo 1.100 moved build-script
        # output to `target/<profile>/build/<crate>/<hash>/out`, one level
        # deeper than before, and ort-sys's copy-dylibs walks a fixed number of
        # ancestors up from OUT_DIR to find the profile directory. On 1.100 it
        # lands in `build/`, then panics creating `build/examples`, so no
        # CUDA-provider target builds at all. 1.99.1 is the toolchain the
        # release gate ran on. Move this only after a release gate on the new
        # toolchain passes locally.
        toolchain: 1.99.1
        targets: ${{ matrix.target }}

    - name: Install system dependencies
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        # Only the cross toolchain, from the runner's own amd64 archive. No
        # foreign architecture, no ports.ubuntu.com, no libssl-dev:
        #
        # - OpenSSL is built from source (`openssl = { features = ["vendored"] }`
        #   in vecdb-core), so no target-arch libssl is needed on any target.
        # - Adding arm64 as a foreign architecture made apt reconcile
        #   Multi-Arch: same packages (gcc, binutils, libstdc++, libssl) across
        #   two mirrors that are not in lockstep. When ports.ubuntu.com lags
        #   the primary archive, the only solution apt finds is to DOWNGRADE
        #   the runner's own x86 compilers, and `-y` without
        #   `--allow-downgrades` refuses (exit 100). The release then depends on
        #   two mirrors being in sync at the minute the tag is pushed.
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        fi

    - name: Build Release
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          # The vendored OpenSSL and every C dependency compile with this CC;
          # openssl-sys ignores OPENSSL_*_DIR when the vendored feature is on,
          # so no sysroot or pkg-config pointers are set here.
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
        fi
        cargo build --release --target ${{ matrix.target }}

    - name: Prepare Artifacts for Upload
      shell: bash
      run: |
        mkdir -p dist
        # Copy binaries
        cp target/${{ matrix.target }}/release/vecdb${{ matrix.asset_ext }} dist/
        cp target/${{ matrix.target }}/release/vecdb-server${{ matrix.asset_ext }} dist/
        cp target/${{ matrix.target }}/release/vecq${{ matrix.asset_ext }} dist/
        
        # ONNX Runtime itself is linked statically; nothing else is needed for
        # CPU embedding. The CUDA execution provider is a separate library that
        # ORT loads at runtime from the directory of the RUNNING BINARY, and it
        # must come from the exact ORT build the binary links (ort's copy-dylibs
        # feature symlinks that build's own copies into the target profile dir;
        # see docs/GPU.md). So the two provider libraries ship at the ARCHIVE
        # ROOT, next to the binaries — never in a lib/ subdirectory, which ORT
        # never consults. A prebuilt user then has a GPU-capable install by
        # extracting the archive; without them use_gpu=true is a hard error.
        #
        # Deliberate, and allowed to fail: on x86_64 Linux the CUDA build is the
        # one this project tests against, so a missing provider there fails the
        # release. Elsewhere the libraries ship when ORT's prebuilt for that
        # target has them, and the log says plainly when it does not — an
        # archive-building step that cannot fail cannot be trusted (an earlier
        # `find … || true` here matched nothing for four releases).
        PROFILE_DIR=target/${{ matrix.target }}/release
        echo "provider libraries in $PROFILE_DIR:"
        ls -la "$PROFILE_DIR" | grep -i 'onnxruntime_providers' || true
        shipped=0
        for lib in "$PROFILE_DIR"/*onnxruntime_providers_shared.* "$PROFILE_DIR"/*onnxruntime_providers_cuda.*; do
          [ -e "$lib" ] || continue
          cp -L "$lib" dist/ && shipped=$((shipped + 1))
          echo "  shipping $(basename "$lib")"
        done
        if [ "$shipped" -ne 2 ]; then
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            echo "::error::expected both CUDA execution provider libraries for ${{ matrix.target }}, found $shipped"
            exit 1
          fi
          echo "::warning::no CUDA execution provider shipped for ${{ matrix.target }} ($shipped of 2 libraries present); GPU needs a bring-your-own ONNX Runtime on this target"
        fi

        # Create archive
        cd dist
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a ../${{ matrix.artifact_name }}.zip *
        else
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz *
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.artifact_name }}.tar.gz
          ${{ matrix.artifact_name }}.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@v4
    
    - name: Display downloaded artifacts
      run: ls -R

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: 'Release ${{ github.ref_name }}'
        files: |
          */*.tar.gz
          */*.zip
        generate_release_notes: true
