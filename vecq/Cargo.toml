[package]
name = "vecq"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository = "https://github.com/daryltucker/vecdb"
description = "jq for source code - convert any structured document to queryable JSON"
keywords = ["parser", "json", "jq", "source-code", "query"]
categories = ["command-line-utilities", "parsing", "development-tools"]

[[bin]]
name = "vecq"
path = "src/main.rs"



[lib]
name = "vecq"
path = "src/lib.rs"

[features]
default = []
python-parser = []
c-parser = []
cpp-parser = []
cuda-parser = []
go-parser = []
bash-parser = []
javascript-parser = []
property-testing = []

[dependencies]
# Shared utilities
vecdb-common = { workspace = true }
json5 = { workspace = true }
serde_yaml_ng = { workspace = true }
# Event parser used ONLY for source positions: serde_yaml_ng discards them, so
# without this every YAML node reported the whole document as its line range.
# Already in the tree via syntect; see parsers/yaml_spans.rs.
yaml-rust = "0.4.5"

# Core dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
chrono = { version = "0.4.44", features = ["serde"] }
toml = "1.0"


# Parsing dependencies
pulldown-cmark = "0.13.1"
rustpython-parser = "0.4.0"
tree-sitter = "0.26.6" # Core library - updated to 0.26 for C23 support
tree-sitter-c = "0.24.1" # Supports C23 language features (v0.24.1)
tree-sitter-cpp = "0.23.4" # Latest is still 0.23.4
tree-sitter-go = "0.25.0" # Latest is 0.25.0
tree-sitter-bash = "0.25.1" # Latest is 0.25.1
tree-sitter-javascript = "0.25.0" # Latest is 0.25.0
toml_edit = "0.25.4"
indexmap = "2.13.0" # Required for jaq Val::Obj construction
dirs = "6.0.0"

# File type detection
infer.workspace = true

# Directory walking (respects .gitignore/.vectorignore)
ignore = "0.4.25"

# Caching and performance
lru = "0.16.3"

# Testing
proptest = { version = "1.10.0", optional = true }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
termimad = "0.34.1"

syntect = "5.3.0"
quick-xml = { version = "0.39.2", features = ["serialize"] }
tree-sitter-rust = "0.24.0"
regex = "1.12.3"
ahash = "0.8.12"
jaq-core = "=3.0.0-beta"
jaq-std = "=3.0.0-beta"
jaq-json = "=2.0.0-beta"
jaq-parse = "=1.0.3"
foldhash = "=0.1.5"

[dev-dependencies]
proptest = "1.10.0"
tempfile = "3.26.0"
criterion = "0.8.2"
pretty_assertions = "1.4.1"
assert_cmd = "2.1.2"
predicates = "3.1.4"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vecdb-{ target }.tar.gz"
pkg-fmt = "tgz"
# Binaries sit at the ARCHIVE ROOT — release.yml does `cd dist && tar -czvf ... *`.
#
# binstall already resolved this correctly WITHOUT this key: it walks a list of
# candidate directories, none of which exist here, so the prefix comes out empty
# and it lands on the root. Confirmed in the field across seven Raspberry Pis.
#
# Set explicitly anyway, because the fallback when bin-dir resolution fails is
# `compile` — a silent switch to building from source. On the machines this path
# exists to serve, that turns a 30-second install into a multi-day one, with no
# error to explain it. Explicit means a future archive-layout change fails loudly
# instead.
bin-dir = "{ bin }{ binary-ext }"

# Never silently compile.
#
# binstall's default fallback when it cannot find a prebuilt artifact is
# `compile` — it quietly switches to `cargo install` and starts building. This
# project pulls in ONNX Runtime; on the ARM boards this path exists to serve,
# that turns a 30-second install into days, and the only signal is that the
# command has not returned yet.
#
# Refuse instead. A missing artifact for your target is a fact worth an error:
# either CI did not build it (32-bit Raspberry Pi OS, musl and FreeBSD have no
# artifact) or the release is broken, and both deserve to be said out loud.
#
# Deliberate source builds are still available two ways, neither of which can
# happen by accident:
#     cargo install --git <repo> --locked vecdb-cli
#     cargo binstall --strategies crate-meta-data,compile --git <repo> vecdb-cli
# (a `--strategies` flag on the command line overrides this key entirely)
disabled-strategies = ["compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/vecdb-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"


