# Multi-document YAML with the shapes that actually appear in config.
version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      - qdrant
    command: ["vecdb", "serve"]

volumes:
  qdrant_storage: null

networks:
  default:
    driver: bridge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vecdb-config
data:
  enabled: true
  replicas: 3
  ratio: 0.75
