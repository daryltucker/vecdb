# Test Configuration - DO NOT use production Qdrant!
# This config is used by ALL test tiers for consistency.
#
# Collection names are `test_`-prefixed, including the per-profile defaults.
# A test that omits `-c` inherits the default, so a default named after a real
# collection ("docs") silently pulls those tests onto a production name and lets
# them collide with each other's embedding spaces. The Tier 0 isolation gate
# enforces the prefix; it is not merely a convention.

default_profile = "tier1_basic"

[ingestion]
path_rules = [
  { pattern = "(?P<year>\\d{4})/(?P<quarter>Q\\d)/.*" }
]

# ── Backends: WHERE a model runs ─────────────────────────────────────────────
# Connection only. Reusable by many embedders.

[backend.local]
kind = "fastembed"

[backend.ollama_test]
kind = "ollama"
url = "http://localhost:11434"

# ── Embedders: WHAT model, and HOW it is tuned ───────────────────────────────
# Each references a backend. Two embedders may share one.

[embedder.small]
backend = "local"
model = "BAAI/bge-small-en-v1.5"
batch_rows = 2

[embedder.ollama_nomic]
backend = "ollama_test"
model = "nomic-embed-text"
num_ctx = 4096
batch_inputs = 8

# ── Profiles: WHICH embedder, and WHICH store ────────────────────────────────

# bge-small-en-v1.5 is a 512-token encoder, so this target is constrained by the
# model, not by taste: 256 x 1.15 = 294 against 512, and the derived 1536-byte
# ceiling is ~439 tokens worst case, so nothing is clamped or truncated. A
# larger target lands in the tokenizer margin, where full-size chunks truncate
# silently — a fixture that truncates is not testing anything anyone should run.
[profiles.tier1_basic]
embedder = "small"
qdrant_url = "http://localhost:6336"
default_collection_name = "test_default"
target_chunk_size = 256

# "Large chunks" needs a model that can hold large chunks: no target big enough
# to be interestingly large fits a 512-token window, so this uses the
# 8192-token model and the profile means what its name says. The dimension
# differs from `small` (768 vs 384) — that is a separate embedding space on
# purpose, not an accident.
[profiles.tier1_large_chunks]
embedder = "other_model"
qdrant_url = "http://localhost:6336"
default_collection_name = "test_default"
target_chunk_size = 2000

[profiles.tier1_ollama]
embedder = "ollama_nomic"
qdrant_url = "http://localhost:6335"
default_collection_name = "test_default"
target_chunk_size = 500

# ── Routing across embedding spaces (T2.6d) ──────────────────────────────────
#
# `.vecdbrc` can fan one tree across collections whose profiles resolve to
# different models or stores. One ingest pass holds a single embedder and a
# single backend, so `ingest` splits the run — one pass per destination. These
# entries give that test the three cases it has to distinguish:
#
#   route_gpu   same model as `small`, on the GPU  — the operator's real path
#   route_alias same model, different embedder NAME — must NOT split
#               (this is the `nomic_gpu` / `nomic_cpu` shape)
#   route_other a genuinely different model         — must split
#
# GPU needs a binary built `--features cuda-dynamic` plus ORT_DYLIB_PATH; the
# path is machine-specific and therefore supplied by the environment, never
# pinned here.

[embedder.small_gpu]
backend = "local"
model = "BAAI/bge-small-en-v1.5"
batch_rows = 2
use_gpu = true

[embedder.small_alias]
backend = "local"
model = "BAAI/bge-small-en-v1.5"
batch_rows = 2

[embedder.other_model]
backend = "local"
model = "nomic-embed-text-v1.5"
batch_rows = 2

[profiles.route_cpu]
embedder = "small"
qdrant_url = "http://localhost:6336"
default_collection_name = "test_route_near"
target_chunk_size = 500

[profiles.route_gpu]
embedder = "small_gpu"
qdrant_url = "http://localhost:6336"
default_collection_name = "test_route_near"
target_chunk_size = 500

[profiles.route_alias]
embedder = "small_alias"
qdrant_url = "http://localhost:6336"
target_chunk_size = 500

[profiles.route_other]
embedder = "other_model"
qdrant_url = "http://localhost:6336"
target_chunk_size = 500

# Two entry points instead of one, because an explicit `--profile` overrides
# EVERY collection's own profile — including the routed ones — which flattens
# the run to a single embedder and hides the very split under test. The real
# command (`vecdb ingest ./`) passes no `--profile`, so each collection resolves
# through its own entry; the test must invoke it the same way.
[collections.test_route_near_cpu]
name = "test_route_near_cpu"
profile = "route_cpu"

[collections.test_route_near_gpu]
name = "test_route_near_gpu"
profile = "route_gpu"

[collections.test_route_far]
name = "test_route_far"
profile = "route_other"

# Same space as the run — pairs with test_route_far to prove a same-model route
# does not trigger a split.
[collections.test_route_same]
name = "test_route_same"
profile = "route_alias"

# ── AST granularity is a per-destination property (T2.8) ─────────────────────
#
# `pack_target_bytes`, not `target_chunk_size`, governs chunk size for code,
# markdown, JSON and YAML — everything with a parser. These two collections are
# identical apart from that knob, so a test can ingest the same files into both
# and compare the chunk sizes that actually come out.
#
# Same embedder on purpose: the only variable is granularity.
[collections.test_pack_small]
name = "test_pack_small"
profile = "route_cpu"
pack_target_bytes = 400

[collections.test_pack_large]
name = "test_pack_large"
profile = "route_cpu"
pack_target_bytes = 4000

# ── A profile's default collection is still a collection (T2.7e) ─────────────
#
# The profile sets a LOOSE pack target and names a default collection whose own
# entry sets a TIGHT one. A bare `vecdb ingest DIR` — no `-c`, no `.vecdbrc` —
# writes into that collection, so the collection's 400 must govern it, not the
# profile's 4000.
#
# This shape was untested for a reason worth remembering: a test has to be
# deterministic about where it writes, so every other test names its collection
# explicitly — which is exactly the habit that left the profile-default path
# unexercised while real ingests used it constantly.
[profiles.bare_default]
embedder = "small"
qdrant_url = "http://localhost:6336"
default_collection_name = "test_bare_default"
target_chunk_size = 500
pack_target_bytes = 4000

[collections.test_bare_default]
name = "test_bare_default"
profile = "bare_default"
pack_target_bytes = 400

# The control: no override, so it takes the profile's loose value. Ingesting the
# same files into both is what makes the difference measurable.
[collections.test_bare_ref]
name = "test_bare_ref"
profile = "bare_default"

# A profile pointing at a NON-LOCAL store. Nothing may ever connect to it.
#
# It exists so `vecdb delete --all` can be proven to REFUSE a remote endpoint.
# The guard bails before any network call, so the address needs to be
# unreachable-by-construction rather than merely unused: 192.0.2.0/24 is
# TEST-NET-1 (RFC 5737), reserved for documentation and guaranteed never to
# route. A test that "should not connect" must be unable to.
#
# The PORT is deliberately not 6333/6334. Those are production's, and T0.0
# refuses to see them anywhere in this file — by port alone, without looking at
# the host. That rule is blunt on purpose and is not worth softening for a
# profile whose port is arbitrary: the address is what makes this unreachable.
#
# Do NOT give this profile a collection or point any other test at it.
[profiles.remote_guard]
embedder = "small"
qdrant_url = "http://192.0.2.1:19333"
default_collection_name = "test_never_created"
target_chunk_size = 256
